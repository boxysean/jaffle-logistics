version: 2

models:
  - name: dim_hubs
    description: "Hub dimension."
    columns:
      - name: hub_id
        description: "Primary key. Joined to as origin_hub_id on fct_shipments, home_hub_id on dim_drivers and hub_id on fct_incidents."
        tests: [unique, not_null]

  - name: dim_clients
    description: "Client dimension enriched with contract SLA target."
    columns:
      - name: client_id
        description: >
          Primary key. The left join to stg_contracts assumes at most one contract
          per client; a second contract for a client fans the row out and fails
          this unique test.
        tests: [unique, not_null]
      - name: health
        description: >
          Account-health flag as recorded on the client record (clients seed via
          stg_clients). It is a static attribute, not computed from the on-time,
          ticket or incident figures in fct_account_health.
        tests:
          - accepted_values:
              arguments:
                values: ['healthy', 'watch', 'at-risk']
      - name: sla_ontime_pct
        description: "On-time SLA target from the client's contract, in percent (e.g. 97.0). Null if the client has no contract (left join)."

  - name: dim_drivers
    description: "Driver dimension enriched with home-hub city."
    columns:
      - name: driver_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: home_hub_id
        description: "The hub on the driver record (stg_drivers.hub_id, renamed). Not reconciled with stg_routes.hub_id, which records the hub of each individual route."
        tests:
          - relationships:
              arguments:
                to: ref('dim_hubs')
                field: hub_id

  - name: fct_shipments
    description: "Shipment fact (grain: shipment) with touchpoint counts."
    semantic_model:
      enabled: true
      name: shipments
    agg_time_dimension: created_at
    columns:
      - name: shipment_id
        description: "Primary key; the semantic model's `shipment` primary entity."
        tests: [unique, not_null]
        entity:
          type: primary
          name: shipment
      - name: client_id
        description: "Client that placed the shipment; the semantic model's `client` foreign entity."
        tests:
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: client_id
        entity:
          type: foreign
          name: client
      - name: status
        description: >
          Final shipment outcome: delivered, delayed (arrived late; delivered_at
          is still set), failed or returned. Only delivered counts as on time.
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'delayed', 'failed', 'returned']
        dimension:
          type: categorical
      - name: client_name
        description: "Client name copied from stg_clients at build time so the Semantic Layer can group by it without a client semantic model."
        dimension:
          type: categorical
      - name: client_tier
        description: "Client tier (strategic, mid or small), stg_clients.tier renamed."
        dimension:
          type: categorical
      - name: origin_city
        description: "City of the shipment's origin hub (stg_hubs.city joined on origin_hub_id)."
        dimension:
          type: categorical
      - name: service_level
        description: "Service level booked for the shipment: standard, expedited or freight."
        dimension:
          type: categorical
      - name: created_at
        description: >
          When the shipment was created. This is the semantic model's
          agg_time_dimension, so every metric here is bucketed by creation date,
          not delivery date.
        granularity: day
        dimension:
          type: time
      - name: promised_delivery_at
        description: "When the shipment was promised (see stg_shipments)."
        granularity: day
        dimension:
          type: time
      - name: hours_late
        description: "Hours past the promise; delayed shipments only, null otherwise."
      - name: late_bucket
        description: "on_time, <4h, 4-12h, 1-2d or >2d; null for failed and returned."
        tests:
          - accepted_values:
              arguments:
                values: ['on_time', '<4h', '4-12h', '1-2d', '>2d']
        dimension:
          type: categorical
      - name: delivered_at
        description: "When the shipment arrived; null for failed and returned shipments. A malformed source value is coerced to null by safe_cast in stg_shipments rather than failing the build."
      - name: is_ontime
        description: >
          True when status = 'delivered'. Lateness comes from that status flag;
          promised_delivery_at, hours_late and late_bucket quantify how late and
          agree with it (assert_shipment_lateness_matches_status). Same rule as
          int_client_monthly_sla.delivered, and the on_time_shipments metric sums it.
      - name: touchpoint_count
        description: "Number of int_shipment_touchpoints rows for the shipment (tickets, incidents, CRM notes, incident reports, call transcripts, dispatch notes that reference it); 0 when none."
    metrics:
      - name: shipments
        label: Shipments
        description: "Count of shipments, bucketed by the day each shipment was created."
        type: simple
        agg: count
        expr: shipment_id
      - name: on_time_shipments
        label: On-time shipments
        description: "Shipments with status delivered. Late arrivals carry status delayed and are excluded."
        type: simple
        agg: sum
        expr: case when is_ontime then 1 else 0 end
      - name: on_time_rate
        label: On-time %
        description: >
          Share of shipments with status delivered. A shipment that arrived late
          carries status delayed, and one that never arrived is failed or
          returned, so only delivered counts as on time. Lateness comes from that
          status flag; promised_delivery_at and hours_late measure how late, and
          agree with the flag (assert_shipment_lateness_matches_status). It is the
          same definition
          int_client_monthly_sla uses for ontime_pct, expressed as a fraction.
        type: ratio
        numerator: on_time_shipments
        denominator: shipments
      - name: late_hours
        label: Late hours
        description: >
          Sum of hours_late: total hours delayed shipments arrived past their
          promised_delivery_at. Delivered, failed and returned shipments add nothing.
        type: simple
        agg: sum
        expr: hours_late
      - name: on_time_rate_change_vs_prior_quarter_pts
        label: On-time % change vs prior quarter (pts)
        description: >
          On-time % minus the on-time % one quarter earlier, in percentage
          points. Query at quarter grain. At any other grain the one-quarter
          offset still applies, so the comparison is against three months back.
        type: derived
        expr: (on_time_rate - on_time_rate_prior_quarter) * 100
        input_metrics:
          - name: on_time_rate
          - name: on_time_rate
            alias: on_time_rate_prior_quarter
            offset_window: 1 quarter

  - name: fct_incidents
    description: "Incident fact (grain: incident) with report/work-order flags."
    columns:
      - name: incident_id
        description: "Primary key."
        tests: [unique, not_null]
      - name: hub_id
        description: "Hub the incident is recorded against. Always populated, unlike shipment_id, route_id, driver_id and vehicle_id, which are frequently null."
        tests:
          - relationships:
              arguments:
                to: ref('dim_hubs')
                field: hub_id
      - name: incident_type
        description: "Incident category as recorded at the time (incidents seed `type`). It can differ from the root cause in the report text, e.g. a weather-caused accident is typed 'accident'."
        tests:
          - accepted_values:
              arguments:
                values: ['damage', 'delay', 'accident', 'mispick', 'dispute', 'weather']
      - name: report_count
        description: "Incident reports filed against the incident (stg_incident_reports); 0 when none."
      - name: work_order_count
        description: "Fleet work orders whose linked_incident_id points at the incident; 0 when none."
      - name: has_report
        description: "True when report_count > 0."

  - name: fct_account_health
    description: >
      Monthly account-health fact (grain: client-month). Surfaces the Jaffle
      Equipment decline: on-time % down, ticket/incident counts up across 2025.
    columns:
      - name: account_month_key
        description: "Surrogate key: client_id || ':' || 'YYYY-MM' (month_key macro on month)."
        tests: [unique, not_null]
      - name: client_id
        description: >
          Client. Rows are driven by int_client_monthly_sla, so a client-month
          exists only if the client created at least one shipment that month;
          tickets or incidents in a month with no shipments do not appear.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: client_id
      - name: health
        description: "The client's current health flag from dim_clients, repeated on every month. It is not the flag as it stood in that month."
      - name: month
        description: "First day of the calendar month."
      - name: ontime_pct
        description: "Percent of the month's shipments with status delivered, 0-100, rounded to 1 decimal (from int_client_monthly_sla)."
      - name: sla_target
        description: "Contract on-time SLA target in percent (dim_clients.sla_ontime_pct). Null if the client has no contract."
      - name: ontime_vs_target
        description: "ontime_pct minus sla_target in percentage points, rounded to 1 decimal; negative means below SLA. Computed from the already-rounded ontime_pct."
      - name: ticket_count
        description: "Support tickets the client opened in the month (by opened_at); 0 when none."
      - name: incident_count
        description: "Incidents in the month attributed to the client through the incident's shipment_id. Incidents with no shipment_id cannot be attributed and are not counted."

  - name: fct_account_revenue
    description: >
      Monthly account-revenue fact (grain: client-month, 2020-01 .. 2025-12). Gross,
      contract credits and net revenue by account, with the trailing-12-month on-time
      rate the credits are assessed on. Puts a dollar figure on the 2025 Jaffle
      Equipment service failure. Pre-2023 rows are imputed (measurement_basis
      no_shipment_record); see stg_revenue_ledger for the model and the
      predecessor-SLA caveat.
    semantic_model:
      enabled: true
      name: account_revenue
    agg_time_dimension: revenue_month
    columns:
      - name: revenue_month_key
        tests: [unique, not_null]
        entity:
          type: primary
          name: account_month
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: client_id
        entity:
          type: foreign
          name: client
      - name: client_name
        dimension:
          type: categorical
      - name: tier
        dimension:
          type: categorical
      - name: health
        dimension:
          type: categorical
      - name: measurement_basis
        tests:
          - accepted_values:
              arguments:
                values: ['no_shipment_record', 'partial_history', 'trailing_12m']
        dimension:
          type: categorical
      - name: revenue_month
        granularity: month
        dimension:
          type: time
    metrics:
      - name: gross_revenue
        label: Gross revenue
        description: "Contracted base revenue plus accessorials, before contract credits."
        type: simple
        agg: sum
        expr: gross_revenue
      - name: net_revenue
        label: Net revenue
        description: "Gross revenue less contract service credits."
        type: simple
        agg: sum
        expr: net_revenue
      - name: accessorial_revenue
        label: Accessorial revenue
        description: "Surcharges: expedited premiums, liftgate/waiting time, redelivery and return handling."
        type: simple
        agg: sum
        expr: accessorial_revenue
      - name: credited_amount
        label: Contract credits
        description: "SLA service credits issued (positive amounts, subtracted from gross)."
        type: simple
        agg: sum
        expr: credited_amount
      - name: credit_rate
        label: Credit rate
        description: "Contract credits as a share of gross revenue, as a fraction."
        type: ratio
        numerator: credited_amount
        denominator: gross_revenue

  - name: fct_client_cost_attribution
    description: >
      Monthly client cost-attribution fact (grain: client-month, 2023-01 .. 2025-12).
      Puts route-level cost on accounts through the route-to-client attribution
      bridge (stg_route_client_attribution): route exceptions are summed from
      exception_attributed, and each hub-month's fleet work-order cost (equal to
      stg_cost_ledger maintenance_cost) is spread across clients by their share of
      that hub-month's attributed stops (stop_count x stop_share). Route, stop and
      shipment volume and ledger revenue are carried for context. Caveat: the
      allocation is by share and is therefore an approximation. The bridge records
      which accounts a route carried and in what proportion, not which account caused
      a given breakdown or exception, so read allocated cost as each account's
      proportional exposure, not as cost it caused.
    columns:
      - name: client_month_key
        tests: [unique, not_null]
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clients')
                field: client_id
      - name: month
        tests: [not_null]
      - name: route_count
        description: "Routes the client was attributed to this month (any share)."
      - name: attributed_stops
        description: "Sum of stop_count x stop_share over the client's routes."
      - name: shipment_count
        description: "Shipments created this month for the client (stg_shipments)."
      - name: attributed_exceptions
        description: "Sum of exception_attributed over the client's routes."
      - name: allocated_maintenance_cost
        description: >
          Fleet work-order cost allocated by attributed-stop share within each
          hub-month; an approximation, not a causal assignment. Summed over clients it
          equals total maintenance_cost.
      - name: maintenance_cost_per_stop
        description: "allocated_maintenance_cost / attributed_stops."
      - name: gross_revenue
        description: "Contracted base plus accessorials (stg_revenue_ledger)."
      - name: net_revenue
        description: "Gross revenue less contract credits (stg_revenue_ledger)."
      - name: maintenance_pct_of_gross
        description: "Allocated maintenance as a percentage of gross revenue."
