version: 2

# Schema tests for the staging layer. PK unique/not_null, FK relationships (which
# double as anchor validation — a mis-seeded anchor breaks a join here), and
# accepted_values on every enum (SPEC §7). Generic-test arguments are nested
# under `arguments:` per the dbt 1.11 schema.

models:
  - name: stg_hubs
    description: "One row per hub."
    columns:
      - name: hub_id
        tests: [unique, not_null]
      - name: hub_function
        tests:
          - accepted_values:
              arguments:
                values: ['HQ', 'hub', 'warehouse']

  - name: stg_vehicles
    description: "One row per fleet vehicle."
    columns:
      - name: vehicle_id
        tests: [unique, not_null]
      - name: hub_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubs')
                field: hub_id
      - name: vehicle_type
        tests:
          - accepted_values:
              arguments:
                values: ['van', 'box_truck', 'semi']
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'maintenance', 'retired']

  - name: stg_drivers
    description: "One row per driver."
    columns:
      - name: driver_id
        tests: [unique, not_null]
      - name: hub_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubs')
                field: hub_id
      - name: employment_type
        tests:
          - accepted_values:
              arguments:
                values: ['employee', 'contractor']
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'inactive', 'disputed']

  - name: stg_clients
    description: "One row per client."
    columns:
      - name: client_id
        tests: [unique, not_null]
      - name: tier
        tests:
          - accepted_values:
              arguments:
                values: ['strategic', 'mid', 'small']
      - name: line_of_business
        tests:
          - accepted_values:
              arguments:
                values: ['last-mile', 'LTL', 'warehousing']
      - name: health
        tests:
          - accepted_values:
              arguments:
                values: ['healthy', 'watch', 'at-risk']

  - name: stg_contracts
    description: "One row per contract."
    columns:
      - name: contract_id
        tests: [unique, not_null]
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id

  - name: stg_shipments
    description: "One row per shipment."
    columns:
      - name: shipment_id
        tests: [unique, not_null]
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: origin_hub_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubs')
                field: hub_id
      - name: route_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_routes')
                field: route_id
      - name: service_level
        tests:
          - accepted_values:
              arguments:
                values: ['standard', 'expedited', 'freight']
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'delayed', 'failed', 'returned']
      - name: promised_delivery_at
        description: >
          When the shipment was promised: created_at plus the account's committed
          transit (service level, contract SLA, origin-hub-to-client-region lane, a
          small seeded jitter). For a delivered shipment the promise was met, so it
          lands at or after delivered_at. For a delayed one it was missed, and is
          reconstructed as delivered_at minus hours_late, clamped so it never falls
          before the service-level base transit; a 2023-2024 late shipment's window is
          therefore close to its long actual transit, missed by only hours. Failed and
          returned shipments still carry the promise that was made. Generated by
          scripts/generate_promised_delivery.py.
        tests: [not_null]
      - name: hours_late
        description: >
          Whole hours delivered_at fell after promised_delivery_at. Set only for
          delayed shipments (always positive); null for delivered, failed and returned.
      - name: late_bucket
        description: >
          hours_late banded: on_time (every delivered shipment), <4h (2-3), 4-12h,
          1-2d (13-48), >2d (over 48). Null for failed and returned. Agreement with
          status is enforced by assert_shipment_lateness_matches_status.
        tests:
          - accepted_values:
              arguments:
                values: ['on_time', '<4h', '4-12h', '1-2d', '>2d']

  - name: stg_routes
    description: "One row per route (driver-day at a hub)."
    columns:
      - name: route_id
        tests: [unique, not_null]
      - name: hub_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubs')
                field: hub_id
      - name: driver_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id
      - name: vehicle_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_vehicles')
                field: vehicle_id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'partial', 'canceled']

  - name: stg_incidents
    description: "One row per incident."
    columns:
      - name: incident_id
        tests: [unique, not_null]
      - name: hub_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubs')
                field: hub_id
      - name: shipment_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_shipments')
                field: shipment_id
      - name: route_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_routes')
                field: route_id
      - name: driver_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id
      - name: vehicle_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_vehicles')
                field: vehicle_id
      - name: incident_type
        tests:
          - accepted_values:
              arguments:
                values: ['damage', 'delay', 'accident', 'mispick', 'dispute', 'weather']
      - name: severity
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

  - name: stg_dispatch_notes
    description: "One row per dispatch note."
    columns:
      - name: note_id
        tests: [unique, not_null]
      - name: route_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_routes')
                field: route_id
      - name: driver_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id
      - name: hub_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_hubs')
                field: hub_id

  - name: stg_support_tickets
    description: "One row per support ticket."
    columns:
      - name: ticket_id
        tests: [unique, not_null]
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: shipment_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_shipments')
                field: shipment_id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['open', 'pending', 'resolved']
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: ['email', 'phone', 'chat', 'portal']

  - name: stg_crm_notes
    description: "One row per CRM note."
    columns:
      - name: note_id
        tests: [unique, not_null]
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: note_type
        tests:
          - accepted_values:
              arguments:
                values: ['QBR', 'call', 'plan', 'review']
      - name: sentiment
        tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'concerned']
      - name: shipment_id
        description: "Optional: the shipment a note is about (account-level notes are null)."
        tests:
          - relationships:
              arguments:
                to: ref('stg_shipments')
                field: shipment_id

  - name: stg_incident_reports
    description: "One row per incident report / postmortem."
    columns:
      - name: report_id
        tests: [unique, not_null]
      - name: incident_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_incidents')
                field: incident_id
      - name: shipment_id
        description: "Optional: the affected shipment recorded on the report."
        tests:
          - relationships:
              arguments:
                to: ref('stg_shipments')
                field: shipment_id

  - name: stg_fleet_work_orders
    description: "One row per fleet work order."
    columns:
      - name: wo_id
        tests: [unique, not_null]
      - name: vehicle_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_vehicles')
                field: vehicle_id
      - name: hub_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_hubs')
                field: hub_id
      - name: linked_incident_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_incidents')
                field: incident_id

  - name: stg_cost_ledger
    description: >
      One row per hub-month of non-labour operating cost, 2020-01 .. 2025-12.
      maintenance_cost equals the sum of that hub-month's fleet work orders
      (enforced by tests/assert_cost_ledger_maintenance_reconciles.sql); it is
      zero before 2023-01, which is where fleet_work_orders begins. The other
      lines are modelled: fuel tracks route volume shaped by a seasonal diesel
      index, subcontractor cover spikes in months a hub's exception load exceeds
      its 2023-2024 worst month, facility and technology scale with the hub's
      function and fleet. cost_per_route = total_cost / that month's routes (null
      before 2023, when no routes are recorded) so hubs can be compared by size.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cost_month, hub_id]
    columns:
      - name: cost_month
        tests: [not_null]
      - name: hub_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubs')
                field: hub_id

  - name: stg_route_client_attribution
    description: >
      Route-to-client attribution bridge, one row per route x client the route
      serves (every route in stg_routes, 2023-01 .. 2025-12, one to four clients
      each). stop_share and revenue_share each sum to exactly 1.0 per route;
      exception_attributed sums to the route's exceptions_count (enforced by
      tests/assert_route_attribution_shares_sum_to_one.sql and
      tests/assert_route_attribution_exceptions_reconcile.sql). The mix starts
      from the clients with a shipment on the route and is topped up by each
      account's hub-month shipment volume. It tells you which accounts a route
      carried and in what proportion, not which account caused a given cost.
      Generated by scripts/generate_route_client_attribution.py.
    columns:
      - name: route_client_key
        tests: [unique, not_null]
      - name: route_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_routes')
                field: route_id
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: stop_share
        description: "This client's share of the route's stops, a fraction."
        tests: [not_null]
      - name: revenue_share
        description: "This client's share of the route's revenue, a fraction; can differ from stop_share."
        tests: [not_null]
      - name: exception_attributed
        description: "How many of the route's exceptions_count belong to this client."
        tests: [not_null]

  - name: stg_payroll_monthly
    description: >
      Driver labour cost, one row per driver-month from the first day of the
      driver's hire month through 2025-12-01 (all 56 drivers, 2954 rows). For
      2023-2025 hours_worked is not modelled: it is that driver-month's routes x 9
      hours from routes.csv, so a month with no routes carries zero hours and zero
      pay (enforced by tests/assert_payroll_hours_reconcile_routes.sql). Before 2023,
      when no routes are recorded, hours are a modelled steady state from the
      driver's 2023 mean monthly routes x a documented year factor.
      gross_pay = hours_worked x hourly_rate and total_cost adds the 50% overtime
      premium (overtime_hours x hourly_rate x 0.5), both to the cent (enforced by
      tests/assert_payroll_gross_pay_reconciles.sql). Contractors carry an all-in
      rate roughly double an employee's (it embeds their own benefits and overhead)
      and no overtime; employees carry a base wage plus overtime. Overtime is a
      steady 4 hours per employee-month with hours, capped at hours_worked, plus a
      2025-only uplift where a hub's damage incidents exceed its worst 2023-2024
      month (the HUB-CMH handling-damage cluster lifts CMH overtime) and where the
      hub's delayed or failed CLI-0042 shipments exceed its worst 2023-2024 month
      (the account's 2025 exception load, led by HUB-CHI; 2023-2024 are steady,
      both terms exactly 0). cost_per_route = total_cost / routes_run, null when the driver
      ran no route that month. hub_id is the driver's drivers.csv hub: no route in
      the record is run from another hub, so no mid-tenure move is modelled, though
      the grain would support one. Caveats: (1) DRV-01189 .. DRV-01194 are active in
      drivers.csv but run no routes in 2025, so their 2025 rows carry zero pay; this
      is a gap in the routes record, not modelled attrition. (2) DRV-01188 has an
      exit record dated 2025-09-15 but runs routes through 2025-12; payroll follows
      the routes, so the driver is paid through 2025-12. (3) CLI-0042's 2025
      shipments carry no route_id, so the account's 2025 exception load lands as
      hub-level overtime for the employees at the hub its freight originates from,
      not on individual routes. Generated
      by scripts/generate_payroll_monthly.py.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [payroll_month, driver_id]
    columns:
      - name: payroll_month
        tests: [not_null]
      - name: driver_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id
      - name: hub_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_hubs')
                field: hub_id
      - name: employment_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['employee', 'contractor']
      - name: hours_worked
        tests: [not_null]
      - name: hourly_rate
        tests: [not_null]
      - name: gross_pay
        tests: [not_null]
      - name: overtime_hours
        tests: [not_null]
      - name: total_cost
        tests: [not_null]

  - name: stg_slack_threads
    description: "One row per Slack thread."
    columns:
      - name: thread_id
        tests: [unique, not_null]

  - name: stg_legal_docs
    description: "One row per legal document."
    columns:
      - name: doc_id
        tests: [unique, not_null]
      - name: client_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: driver_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id
      - name: doc_type
        tests:
          - accepted_values:
              arguments:
                values: ['MSA', 'SLA_addendum', 'driver_agreement']

  - name: stg_hr_docs
    description: "One row per HR document."
    columns:
      - name: hr_doc_id
        tests: [unique, not_null]
      - name: driver_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id
      - name: doc_type
        tests:
          - accepted_values:
              arguments:
                values: ['onboarding', 'disciplinary', 'training', 'review', 'certification', 'exit']

  - name: stg_call_transcripts
    description: "One row per CRM call transcript, linked to the crm_note it transcribes."
    columns:
      - name: transcript_id
        tests: [unique, not_null]
      - name: crm_note_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_crm_notes')
                field: note_id
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id

  - name: stg_revenue_ledger
    description: >
      Revenue and cost ledger, one row per account-month (5 accounts x 2020-01 ..
      2025-12). From 2023-01, when the shipment record starts, revenue is derived
      from that month's shipments (rate card by service_level x per-client contract
      factor, plus accessorials), and shipment_count / ontime_pct reconcile to
      stg_shipments. Before 2023 volume and revenue are imputed from the 2023
      same-month record scaled by documented growth and price factors, and the
      measurement columns are null. Credits follow the contract credit_terms (1% of
      monthly spend per full point below the SLA on-time target, capped at 10%),
      assessed on the trailing-12-month on-time rate ending on the billing month,
      so only months with measurement_basis 'trailing_12m' (2024-01 onward) can carry
      one. credited_amount is a positive amount subtracted from gross:
      net_revenue = contracted_base_revenue + accessorial_revenue - credited_amount.
      sla_ontime_pct is the SLA of the contract in force that month (latest
      effective_date on or before it). Caveat: before an account's earliest recorded
      contract it was on a predecessor agreement the register does not hold, and the
      earliest recorded contract's SLA is applied backwards as that predecessor term.
      Generated by scripts/generate_revenue_ledger.py.
    columns:
      - name: revenue_month_key
        tests: [unique, not_null]
      - name: client_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_clients')
                field: client_id
      - name: revenue_month
        tests: [not_null]
      - name: contracted_base_revenue
        tests: [not_null]
      - name: accessorial_revenue
        tests: [not_null]
      - name: credited_amount
        description: "Service credits issued this month: positive, subtracted in net_revenue."
        tests: [not_null]
      - name: net_revenue
        tests: [not_null]
      - name: invoice_count
        tests: [not_null]
      - name: measurement_basis
        tests:
          - accepted_values:
              arguments:
                values: ['no_shipment_record', 'partial_history', 'trailing_12m']
