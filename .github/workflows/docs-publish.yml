name: Publish docs
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "slides/**"
      - ".github/workflows/docs-publish.yml"
  workflow_dispatch:

# mkdocs gh-deploy builds the site and pushes it to the gh-pages branch, which is how this
# repository's Pages site is served (build_type: legacy, source: gh-pages /). The previous
# actions/deploy-pages approach needs the site configured as "GitHub Actions" and cannot deploy
# against a branch-served site - it failed on every run for that reason.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material==9.7.7
      # the decks' source of truth is their parts in slides/deck/ and slides/deck-light/; build them
      # into the docs tree at publish time so the published copies can never drift from the parts.
      # the light deck is the main deck, at presentation.html (where the site root redirects); the
      # full deck it draws on stays published beside it, at presentation-full.html
      - run: python3 slides/build_deck.py --variant light --out docs/shareholder-deck/presentation.html
      - run: python3 slides/build_deck.py --out docs/shareholder-deck/presentation-full.html
      - run: mkdocs gh-deploy --force
