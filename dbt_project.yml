name: 'jaffle_logistics'
version: '1.0.0'
config-version: 2

# vars.yml requires dbt-core 1.12+ (no VARS_FILE_NAME support before that; vars.yml is
# silently ignored, and every var reading from it falls back to its hardcoded default).
require-dbt-version: [">=1.12.0"]

profile: 'jaffle-logistics'

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

flags:
  # Off by default in dbt-core 1.12 for backward compat: without it, analysis-path
  # project configs (the `analyses:` block below) are silently ignored, since
  # dbt-core falls back to resolving analysis config from the `models:` block and
  # an `analysis/`-prefixed FQN instead (dbt/context/context_config.py). Needed
  # here so analyses/the_pattern's own +enabled config actually takes effect;
  # without it, the_pattern's ai_functions_enabled gate silently never applies
  # and `dbt parse` fails whenever the AI layer is disabled (the default).
  require_corrected_analysis_fqns: true

# dbt_context_engineering no longer self-creates ai_run_log (its own bootstrap raced
# under concurrent threads). Runs once, serially, before any model, so there's nothing
# else to race against yet. depends_on is required: ref() inside the macro's
# conditional isn't statically inferable by dbt's parser without it.
on-run-start:
  - "-- depends_on: {{ ref('ai_run_log') }}\n{{ dbt_context_engineering.create_ai_run_log_table() }}"

models:
  jaffle_logistics:
    staging:
      +materialized: view
      +docs:
        node_color: "#D2955C"
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    context:
      # Up-to-meta phase (chunk/reshape through the *_meta models): blue.
      # Overridden to cyan below for the ai/ subfolder (up-to-knowledge-base),
      # and per-model for the seven *_hashed models, which sit between the two.
      +docs:
        node_color: "#7C93B0"
      ai:
        # Real cloud AI-function-cost layer (embed()/classify() calls): seven
        # independent per-source chains (legal_docs/incident_reports/crm_notes/
        # call_transcripts/support_tickets/dispatch_notes/slack_threads)
        # _{classify,embed,embedded_classified},
        # plus knowledge_base and search. Their upstream *_hashed helpers stay
        # outside this gate (models/context/) since they only compute a hash
        # column, no AI call.
        # Disabled by default so a plain `dbt build` can never accidentally
        # trigger AI-function spend.
        # This is an actual selection-time gate (dbt won't build a disabled model
        # even under an explicit --select), not just a documentation convention.
        # Opt in per invocation: --vars '{ai_functions_enabled: true}'.
        # Keyed directly on ai_functions_enabled, dbt_context_engineering's own
        # dispatch-layer var (ADR-0030, enforced inside every generate/classify/
        # extract/embed/ai_agg call via require_ai_functions_enabled): a
        # selected model with this false would fail with that macro's raised
        # compiler error rather than being skipped, so the skip and the raise
        # agree on the same flag.
        +enabled: "{{ var('ai_functions_enabled', false) }}"
        # Up-to-knowledge-base phase: cyan. knowledge_base itself overrides to
        # purple, search overrides to unset, both in models/context/ai/_context_ai.yml.
        +docs:
          node_color: "#7FAFAF"

  # Same gate, same var, applied to the package's own runtime drift monitor
  # (embedding_canary), which also makes real embed() calls and is disabled by
  # the package's own default for the same reason. Unified under one flag so
  # turning on real AI-function spend is a single decision, not two separate
  # ones to remember.
  dbt_context_engineering:
    monitoring:
      +enabled: "{{ var('ai_functions_enabled', false) }}"

analyses:
  jaffle_logistics:
    # the_pattern/00 and /01 only touch pre-AI models and would parse fine either
    # way, but 02-06 ref() the models/context/ai/ layer gated above. Same flag,
    # same lockstep: an enabled analysis ref()ing a disabled model is a parse
    # error (DisabledDependency), so the whole walkthrough moves with the gate
    # rather than splitting into two folders for two files' sake.
    the_pattern:
      +enabled: "{{ var('ai_functions_enabled', false) }}"

seeds:
  jaffle_logistics:
    +quote_columns: false
    # Source phase (the project's raw origin data): green.
    +docs:
      node_color: "#7FA37F"
    contracts:
      # BigQuery's schema autodetection infers this column as INT64 from the sample
      # values, then rejects the literal "97.0" text in the CSV. Force it explicitly
      # (portable: harmless on Snowflake/DuckDB/Databricks, which infer it correctly).
      +column_types:
        sla_ontime_pct: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
    revenue_ledger:
      # Same autodetect hazard as contracts: whole-dollar months ("97.0", "41590.00") and
      # blank pre-2023 measurement columns leave the inference to chance. Money is fixed
      # 2dp so net_revenue reconciles to the cent; percentages are floats.
      +column_types:
        revenue_month: date
        contracted_base_revenue: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18, 2)' }}"
        accessorial_revenue: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18, 2)' }}"
        credited_amount: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18, 2)' }}"
        net_revenue: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18, 2)' }}"
        invoice_count: integer
        shipment_count: integer
        ontime_pct: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
        trailing_12m_ontime_pct: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
        sla_ontime_pct: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
    payroll_monthly:
      # Same hazard: whole-hour and whole-dollar values ("45.0", "1250.00") leave the
      # inference to chance. Fixed 2dp so gross_pay and total_cost reconcile to the cent.
      +column_types:
        payroll_month: date
        hours_worked: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18, 2)' }}"
        hourly_rate: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18, 2)' }}"
        gross_pay: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18, 2)' }}"
        overtime_hours: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18, 2)' }}"
        total_cost: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18, 2)' }}"
    shipments:
      # The promised-delivery clock (scripts/generate_promised_delivery.py): hours_late is
      # blank on all but the delayed rows and late_bucket blank on failed/returned, so
      # autodetect could guess anything. Pin the three new columns; the original ones
      # keep their inferred types.
      +column_types:
        promised_delivery_at: timestamp
        hours_late: "{{ 'int64' if target.type == 'bigquery' else 'integer' }}"
        late_bucket: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
    dock_bay_events:
      # scripts/generate_dock_bay_events.py. route/vehicle/driver are blank on the
      # non-route dock work and incident_id on all but ~55 damage_found rows, so
      # autodetect could guess anything for them; pin those plus the timestamp and dwell.
      +column_types:
        event_at: timestamp
        minutes_at_bay: "{{ 'int64' if target.type == 'bigquery' else 'integer' }}"
        route_id: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        vehicle_id: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        driver_id: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"
        incident_id: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"

  # Mirrors the models: dbt_context_engineering: monitoring: +enabled override above. The
  # package ships this seed disabled by default, paired with its own monitoring +enabled: false;
  # without this override the canary model turns on via ai_functions_enabled but its baseline
  # seed stays off, so assert_embedding_canary_matches_baseline can never actually run.
  #
  # KNOWN-ISSUE(dbt-core#16128): with ai_functions_enabled true, `dbtf build --target duckdb`
  # fails loading this seed. Fusion's duckdb adapter doubles the package root when resolving a
  # package-owned seed's file path (.../dbt_packages/dbt_context_engineering/dbt_packages/
  # dbt_context_engineering/seeds/embedding_canary_baseline.csv), so the file is never found.
  # Confirmed Fusion-engine-only (dbt-core 1.12 loads it fine on every adapter, and Fusion loads
  # it fine on snowflake/bigquery/databricks; only the duckdb+Fusion combination fails) and
  # confirmed unrelated to this project or to dbt_context_engineering's own seed-paths config
  # (both correct). Not fixable here — tracked upstream at
  # https://github.com/dbt-labs/dbt-core/issues/16128. Resolves automatically once dbt-fusion
  # ships a fix; no project-side action needed then.
  dbt_context_engineering:
    +enabled: "{{ var('ai_functions_enabled', false) }}"

