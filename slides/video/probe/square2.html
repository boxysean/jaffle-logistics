<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #111; }
  #box {
    position: absolute; top: 300px; left: 0; width: 100px; height: 100px;
    background: #f0f;
    animation: slide 2s linear forwards;
  }
  @keyframes slide { from { left: 0; } to { left: 1000px; } }
</style>
</head>
<body>
<div id="box"></div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var seek = function () {
    if (!p.has('t')) return;
    var t = parseFloat(p.get('t')) * 1000;
    document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = t; });
  };
  document.addEventListener('DOMContentLoaded', seek);
  window.addEventListener('load', seek);
})();
</script>
</body>
</html>
